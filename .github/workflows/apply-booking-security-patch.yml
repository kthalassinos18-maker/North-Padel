name: Apply booking security patch

on:
  push:
    branches: [audit-fixes]
    paths:
      - '.github/workflows/apply-booking-security-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit-fixes
        uses: actions/checkout@v4
        with:
          ref: audit-fixes

      - name: Patch public booking flow
        run: python scripts/patch-booking-security.py

      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git add index.html
          git commit -m 'Security fix #1: separate public availability from private bookings'
          git push origin audit-fixes
